<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <main class="main">
      <!-- page intro -->
      <section class="pricing-plans">
        <!-- section intro -->
        <p class="pricing-plans__descriptions">
          Choose the pricing plan that fits your needs and budget. All plans
          come with a free trial period so you can test out our service and see
          which plan works best for you.
        </p>
        <div class="pricing-plans__cards">
          <!-- component offer-card -->
          <div class="offer-card">
            <h3 class="offer-card__title">Basic Plan</h3>
            <p class="offer-card__price">
              <span class="offer-card__price-currency">$</span
              ><span class="offer-card__price-value">99</span>
              <span class="offer-card__price-label">/ month</span>
            </p>
            <p class="offer-card__description">
              All the basic features to boost your freelance career
            </p>
            <div class="offer-card__list">
              <!-- component icon-list -->
            </div>
            <div class="offer-card__button">
              <!-- component button -->
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
